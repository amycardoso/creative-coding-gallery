name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sketch-updated]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pin sketches to the latest commit
        run: echo "SKETCHES_REF=$(git ls-remote https://github.com/amycardoso/creative-coding refs/heads/main | cut -f1)" >> "$GITHUB_ENV"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # build-media.mjs decides per piece what is still valid (source blob SHA
      # plus every output file present), so the cache only has to hand back the
      # newest public/media. The run-specific key never matches, so restore
      # always falls back to the most recent media-* entry, and a fresh one is
      # saved whenever something was encoded. (A fixed key per sketches commit
      # froze a stale cache: once that key existed it was never saved again,
      # and every deploy re-encoded all pieces.)
      - name: Restore encoded media
        uses: actions/cache/restore@v4
        with:
          path: public/media
          key: media-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: media-

      - name: Encode GIFs as video and thumbnails
        id: media
        run: npm run media
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save encoded media
        if: steps.media.outputs.encoded != '0'
        uses: actions/cache/save@v4
        with:
          path: public/media
          key: media-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Copy the sketches to run live
        run: npm run live
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
