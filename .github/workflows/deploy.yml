name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sketch-updated]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pin sketches to the latest commit
        run: echo "SKETCHES_REF=$(git ls-remote https://github.com/amycardoso/creative-coding refs/heads/main | cut -f1)" >> "$GITHUB_ENV"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Encoded media is keyed by each source file's blob SHA, so a restored
      # cache means only new or changed GIFs get encoded.
      - name: Restore encoded media
        uses: actions/cache@v4
        with:
          path: public/media
          key: media-${{ env.SKETCHES_REF }}
          restore-keys: media-

      - name: Encode GIFs as video and thumbnails
        run: npm run media
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Copy the sketches to run live
        run: npm run live
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
